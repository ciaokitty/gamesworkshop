<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMENS</title>
<link rel="stylesheet" href="/households/omens.css">
</head>
<body>
<button class="corner" id="theme">LIGHT</button>
<main class="title-screen">
  <h1 class="logo">OMENS</h1>
  <p class="sub">HOUSEHOLDS</p>
  <div class="omen-row" id="omens" aria-hidden="true"></div>
  <nav aria-label="Menu"><ol class="menu">
    <li><a href="/households/icons.html"><span class="num">1</span><span class="name">ICONS</span><small>HARVEST - CASH - ATTENDANCE - WEATHER</small></a></li>
    <li><a href="/audience"><span class="num">2</span><span class="name">AUDIENCE SHEET</span><small>THE HOUSEHOLDS DATASHEET</small></a></li>
    <li><a href="/paperweights/web/?scenario=households&amp;mode=medium&amp;seed=7&amp;trial"><span class="num">3</span><span class="name">TRIAL RUN</span><small>PRACTICE: FLIP CARDS, ASK THE AUDIENCE AND THE AI</small></a></li>
    <li><a href="/paperweights/web/?scenario=households&amp;mode=medium"><span class="num">4</span><span class="name">PLAY</span><small>START THE GAME</small></a></li>
  </ol></nav>
</main>
<script type="module">
import { pixelIcons } from '/households/pixel-cards.js';
const $ = s => document.querySelector(s);
let theme = 'dark';
try { theme = localStorage.getItem('paperweights.theme.v1') === 'light' ? 'light' : 'dark'; } catch {}
const paintTheme = () => { document.documentElement.dataset.theme = theme; $('#theme').textContent = theme === 'dark' ? 'LIGHT' : 'DARK'; };
$('#theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('paperweights.theme.v1', theme); } catch {} paintTheme(); };
paintTheme();
$('#omens').innerHTML = [pixelIcons.harvest.good, pixelIcons.cash.enough, pixelIcons.attendance.regular, pixelIcons.weather.storm].join('');

// A game menu: arrows or hover move the cursor, Enter or 1-4 open.
const items = [...document.querySelectorAll('.menu a')];
let sel = 0;
const select = i => { sel = (i + items.length) % items.length; items.forEach((a, j) => a.classList.toggle('on', j === sel)); };
items.forEach((a, i) => { a.onmouseenter = () => select(i); a.onfocus = () => select(i); });
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); select(sel + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); select(sel - 1); }
  else if (e.key === 'Enter' && document.activeElement?.tagName !== 'A' && document.activeElement?.tagName !== 'BUTTON') items[sel].click();
  else if (/^[1-4]$/.test(e.key)) items[Number(e.key) - 1].click();
});
select(0);
</script>
</body>
</html>
