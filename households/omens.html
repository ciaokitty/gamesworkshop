<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMENS</title>
<link rel="stylesheet" href="/households/omens.css">
</head>
<body>
<div class="corner"><button id="sound">SOUND OFF</button><button id="theme">LIGHT</button></div>
<main class="title-screen">
  <h1 class="logo">OMENS</h1>
  <nav aria-label="Menu"><ul class="menu">
    <li><a href="/paperweights/web/?scenario=households&amp;mode=medium&amp;seed=7&amp;trial"><span class="name">TRIAL RUN</span><small>PRACTICE: FLIP CARDS, ASK THE AUDIENCE AND THE AI</small></a></li>
    <li><a href="/audience"><span class="name">AUDIENCE SHEET</span><small>THE HOUSEHOLDS DATASHEET</small></a></li>
    <li><a href="/households/icons.html"><span class="name">ICONS</span><small>HARVEST - CASH - ATTENDANCE - WEATHER</small></a></li>
    <li><a href="/paperweights/web/?scenario=households&amp;mode=medium"><span class="name">PLAY</span><small>START THE GAME</small></a></li>
  </ul></nav>
</main>
<script type="module">
import { backgroundMusic } from '/households/music.js';
const $ = s => document.querySelector(s);
const music = backgroundMusic('assets/audio/bachs-chips-loop.ogg', 0.5); // Bach's Chips, Dylann Taylor
// Same on/off setting as the game stage's sound button, so turning it off here keeps the game quiet too.
// The button shows what is really playing: OFF while the browser waits for a click, and that click is this button.
const soundKey = 'households.sound.v1';
let soundOn = false, wanted = true;
try { wanted = localStorage.getItem(soundKey) !== 'off'; } catch {}
const paintSound = () => { $('#sound').textContent = soundOn ? 'SOUND ON' : 'SOUND OFF'; $('#sound').setAttribute('aria-pressed', soundOn); };
$('#sound').onclick = () => { soundOn = wanted = !soundOn; try { localStorage.setItem(soundKey, soundOn ? 'on' : 'off'); } catch {} music.set(soundOn); paintSound(); };
if (wanted) music.allowed.then(ok => { if (ok && wanted) { soundOn = true; paintSound(); } });
else music.set(false);
paintSound();
let theme = 'dark';
try { theme = localStorage.getItem('paperweights.theme.v1') === 'light' ? 'light' : 'dark'; } catch {}
const paintTheme = () => { document.documentElement.dataset.theme = theme; $('#theme').textContent = theme === 'dark' ? 'LIGHT' : 'DARK'; };
$('#theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('paperweights.theme.v1', theme); } catch {} paintTheme(); };
paintTheme();

// A game menu: arrows or hover move the cursor, Enter opens.
const items = [...document.querySelectorAll('.menu a')];
let sel = 0;
const select = i => { sel = (i + items.length) % items.length; items.forEach((a, j) => a.classList.toggle('on', j === sel)); };
items.forEach((a, i) => { a.onmouseenter = () => select(i); a.onfocus = () => select(i); });
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); select(sel + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); select(sel - 1); }
  else if (e.key === 'Enter' && document.activeElement?.tagName !== 'A' && document.activeElement?.tagName !== 'BUTTON') items[sel].click();
});
select(0);
</script>
</body>
</html>
