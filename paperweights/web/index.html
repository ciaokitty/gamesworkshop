<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rover Run - Competitive</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="competitive.css?v=pw6-fit"><link rel="stylesheet" href="shared-map.css?v=pw6-fit"><style>/* Households loading screen: the stage is built by modules, so cover it until it is ready */@font-face{font-family:"Jersey 10";src:url("../../households/assets/fonts/Jersey10-Regular.ttf") format("truetype");font-display:swap}#hh-loader{display:none}html.hh-loading body>main{visibility:hidden}html.hh-loading,html.hh-loading body{background:#28251f}html.hh-loading[data-theme=light],html.hh-loading[data-theme=light] body{background:#fff}html.hh-loading #hh-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font:36px/1 "Jersey 10",monospace;letter-spacing:.12em}.hh-kid{width:84px;height:126px;background:url("../../households/assets/loader-kid.svg") -84px 0/336px 126px;image-rendering:pixelated;animation:hh-walk .6s infinite}.hh-road{width:168px;height:24px;margin-top:-12px;border-block:6px solid #7a5a3a;background:repeating-linear-gradient(90deg,#c9a274 0 12px,#b48d62 0 42px) 0 0/42px 100%;animation:hh-road .6s linear infinite}.hh-text{margin-top:28px}.hh-text i{font-style:normal;animation:hh-dot 1.2s steps(1,end) infinite}.hh-text i:nth-child(2){animation-delay:.2s}.hh-text i:nth-child(3){animation-delay:.4s}@keyframes hh-walk{0%{background-position-x:-84px;transform:none;animation-timing-function:steps(1,end)}25%{background-position-x:-168px;transform:translateY(-6px);animation-timing-function:steps(1,end)}50%{background-position-x:-252px;transform:none;animation-timing-function:steps(1,end)}75%{background-position-x:-168px;transform:translateY(-6px);animation-timing-function:steps(1,end)}100%{background-position-x:-84px;transform:none}}@keyframes hh-road{to{background-position-x:-42px}}@keyframes hh-dot{0%{opacity:0}30%,100%{opacity:1}}@media(prefers-reduced-motion:reduce){.hh-kid,.hh-road,.hh-text i{animation:none}}</style><script>(()=>{const d=document.documentElement;try{if(localStorage.getItem('paperweights.theme.v1')==='light')d.dataset.theme='light'}catch{}if(new URLSearchParams(location.search).get('scenario')!=='households')return;d.classList.add('hh-loading');const show=()=>d.classList.remove('hh-loading');setTimeout(show,8000);addEventListener('error',show);addEventListener('unhandledrejection',show)})()</script></head>
<body><div id="hh-loader" role="status" aria-label="Loading"><div class="hh-kid"></div><div class="hh-road"></div><div class="hh-text">LOADING<i>.</i><i>.</i><i>.</i></div></div><main><header class="bar"><span class="title">MAP: Jezero, Mars</span><span id="pack-id"></span><div class="controls"><select id="scenario" aria-label="Scenario"><option value="rover">Rover</option><option value="households">Households</option><option value="sentences">Sentences</option></select><select id="difficulty" aria-label="Difficulty"><option value="easy">Risks</option><option value="medium" selected>Indicators</option><option value="hard">Judgement</option></select><span id="view-label">CURRENT</span><button id="reset">Reset</button><button id="theme" aria-label="Switch color theme">Light</button><label class="stage-control"><select id="stage" aria-label="Stage" hidden></select></label></div></header><div class="shared-map"><div class="shared-canvas"><canvas id="shared-canvas" aria-label="Shared map with four labelled rover markers"></canvas></div></div><div id="teams" class="teams"></div><p id="error" role="alert"></p></main><script type="module" src="entry.js"></script></body></html>
